name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: 167.233.158.68
          username: root
          key: \${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            cd /opt/hermes-multi-tenant
            git fetch origin
            git reset --hard origin/main
            docker compose up -d --build
