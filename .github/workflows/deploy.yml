name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}
      - run: ssh-keyscan 167.233.158.68 >> ~/.ssh/known_hosts
      - run: ssh root@167.233.158.68 "cd /opt/hermes-multi-tenant && git fetch origin && git reset --hard origin/main && docker compose up -d --build"
