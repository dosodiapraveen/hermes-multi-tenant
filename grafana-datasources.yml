apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Extract request_id for linking logs
        - matcherRegex: "request_id=([\\w-]+)"
          name: Request ID
          url: ""

        # Extract user_id for filtering
        - matcherRegex: "user_id=([\\w-]+)"
          name: User ID
          url: ""
