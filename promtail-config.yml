server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape logs from Docker containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'

      # Extract container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

      # Extract image name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Only scrape specific containers (backend, frontend, postgres)
      - source_labels: ['container_name']
        regex: '.*(hermes-backend|hermes-frontend|hermes-postgres).*'
        action: keep

      # Add environment label
      - target_label: 'environment'
        replacement: 'production'

      # Add application label
      - target_label: 'application'
        replacement: 'hermes'

    # Pipeline stages to parse JSON logs
    pipeline_stages:
      # Parse JSON logs from backend
      - json:
          expressions:
            timestamp: timestamp
            level: level
            event: event
            message: message
            request_id: request_id
            user_id: user_id
            ip_address: ip_address

      # Extract timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.999999999Z"
            - "2006-01-02T15:04:05Z"

      # Extract log level
      - labels:
          level:
          event:
          request_id:
          user_id:

      # Set output format
      - output:
          source: message
