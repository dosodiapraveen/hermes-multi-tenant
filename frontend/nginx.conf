server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Force revalidation of JS/CSS so browsers always fetch the current bundle
    # (the hashed asset names are not changing across builds, so without this
    # browsers keep serving a stale cached copy of the app).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
